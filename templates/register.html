<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Fitness Tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="d-flex align-items-center" style="min-height:100vh">
<div class="container" style="max-width:420px">
  <h3 class="text-center mb-4">🏋 Fitness Tracker</h3>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post" class="card metric-card p-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h5 class="mb-3">Create account</h5>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" required autofocus minlength="3">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required minlength="8">
      <div class="form-text">At least 8 characters.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm password</label>
      <input type="password" class="form-control" name="confirm_password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary w-100">Create account</button>
    <div class="text-center mt-3 small">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </form>
</div>
<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
