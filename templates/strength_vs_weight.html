{% extends "base.html" %}
{% block title %}Strength vs Weight{% endblock %}
{% block content %}
<ul class="nav nav-tabs mb-3">
  <li class="nav-item"><a class="nav-link" href="{{ url_for('reports.weekly') }}">Weekly Summary</a></li>
  <li class="nav-item"><a class="nav-link" href="{{ url_for('reports.trends') }}">Trend Analysis</a></li>
  <li class="nav-item"><a class="nav-link active" href="{{ url_for('reports.strength_vs_weight') }}">Strength vs Weight</a></li>
  <li class="nav-item"><a class="nav-link" href="{{ url_for('reports.calorie_vs_weight') }}">Calories vs Weight</a></li>
</ul>

{% if not exercises %}
<div class="alert alert-light border">Add exercises and log a few workouts to use this analysis.</div>
{% else %}
<form class="mb-3" method="get">
  <select class="form-select" style="max-width:300px" name="exercise_id" onchange="this.form.submit()">
    {% for ex in exercises %}<option value="{{ ex.id }}" {{ 'selected' if ex.id == selected_id }}>{{ ex.name }}</option>{% endfor %}
  </select>
</form>

<div id="interpretation" class="alert alert-primary" style="display:none"></div>

<div class="card metric-card p-3">
  <canvas id="svwChart" height="90"></canvas>
</div>

<script>
fetch(`{{ url_for('reports.strength_vs_weight_data') }}?exercise_id={{ selected_id }}`).then(r => r.json()).then(data => {
  if (data.interpretation) {
    const box = document.getElementById('interpretation');
    box.style.display = 'block';
    box.textContent = data.interpretation;
  }
  new Chart(document.getElementById('svwChart'), {
    data: {
      labels: data.labels,
      datasets: [
        { type: 'line', label: 'Estimated 1RM (kg)', data: data.strength, borderColor: '#2563eb', yAxisID: 'y', tension: 0.25 },
        { type: 'line', label: 'Body weight (kg)', data: data.weight, borderColor: '#dc2626', yAxisID: 'y1', tension: 0.25 },
      ]
    },
    options: {
      responsive: true,
      scales: {
        y: { position: 'left', title: { display: true, text: '1RM (kg)' } },
        y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Body weight (kg)' } },
      }
    }
  });
});
</script>
{% endif %}
{% endblock %}
