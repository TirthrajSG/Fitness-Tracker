{% extends "base.html" %}
{% block title %}Welcome{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h2 class="mb-1">Let's set up your profile</h2>
    <p class="text-muted mb-4">This takes a minute and drives your dashboard, calorie target, and goal tracking.</p>

    <form method="post" class="card p-4 metric-card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nickname (optional)</label>
          <input type="text" class="form-control" name="name">
        </div>
        <div class="col-md-3">
          <label class="form-label">Age</label>
          <input type="number" class="form-control" name="age" required min="10" max="100">
        </div>
        <div class="col-md-3">
          <label class="form-label">Sex</label>
          <select class="form-select" name="sex" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Height (cm)</label>
          <input type="number" step="0.1" class="form-control" name="height_cm" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Current weight (kg)</label>
          <input type="number" step="0.1" class="form-control" name="current_weight" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Activity level</label>
          <select class="form-select" name="activity_level">
            <option value="sedentary">Sedentary</option>
            <option value="light">Light</option>
            <option value="moderate" selected>Moderate</option>
            <option value="active">Active</option>
            <option value="very_active">Very active</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Target weight (kg)</label>
          <input type="number" step="0.1" class="form-control" name="target_weight" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Target date (optional)</label>
          <input type="date" class="form-control" name="target_date">
        </div>
        <div class="col-md-4">
          <label class="form-label">Desired rate (kg/week)</label>
          <input type="number" step="0.05" class="form-control" name="desired_weekly_rate" value="0.4">
        </div>

        <div class="col-md-6">
          <label class="form-label">Daily calorie target (optional — leave blank to estimate TDEE − 500)</label>
          <input type="number" class="form-control" name="calorie_target">
        </div>
        <div class="col-md-6">
          <label class="form-label">Daily protein target g (optional — default 1.8 g/kg)</label>
          <input type="number" class="form-control" name="protein_target">
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-4">Start tracking</button>
    </form>
  </div>
</div>
{% endblock %}
